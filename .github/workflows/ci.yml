name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install bash-completion for the completion test
        run: sudo apt-get update && sudo apt-get install -y bash-completion
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Smoke test the bundle
        run: node dist/dcabsm.js --version
      - name: The build leaves the completion script
        run: test -s dist/share/bash-completion/completions/dcabsm

  tarballs:
    name: tarballs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fetches the pinned Node for each architecture and checks it against nodejs.org's signed
      # SHASUMS256.txt. Nothing is signed here: the author signs SHA256SUMS on their own machine.
      - name: Build both tarballs and SHA256SUMS
        run: npm run package
      - name: The tarballs match SHA256SUMS
        run: cd dist/release && sha256sum --check SHA256SUMS
      - name: The amd64 tarball unpacks and runs
        run: |
          dir=$(mktemp -d)
          tar -xzf dist/release/dcabsm-*-linux-amd64.tar.gz -C "$dir" --strip-components=1
          "$dir/bin/dcabsm" --version
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            install.sh
          if-no-files-found: error

  # Spec 13.2, 13.3: the real dcabsm as root in a privileged systemd container, on every supported OS,
  # on native amd64 and arm64 runners. The CI-built tarball is what gets installed.
  containers:
    name: containers (${{ matrix.os }}, ${{ matrix.arch }})
    needs: tarballs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [debian-13, ubuntu-24.04, ubuntu-26.04]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v7
        with:
          name: release-files
      # The pinned Releases, their npm cache and Node are fetched once per change to the pins.
      - uses: actions/cache@v5
        with:
          path: .cache/container-pins/${{ matrix.arch }}
          key: container-pins-${{ matrix.arch }}-${{ hashFiles('test/container/pins.json', '.node-version') }}
      - name: Run the journey
        run: test/container/run.sh ${{ matrix.os }}

  release-guard:
    name: release guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No release-time placeholders are left
        run: |
          if grep -nE '^(GITHUB_OWNER|KEY_FINGERPRINT|KEY_KEYRING_B64)=.*PLACEHOLDER' install.sh; then
            echo "::error::install.sh still has GITHUB_OWNER, KEY_FINGERPRINT or KEY_KEYRING_B64 unfilled"
            exit 1
          fi
          if grep -n 'XXXX' README.md docs/cli.md; then
            echo "::error::README.md or docs/cli.md still has the XXXX fingerprint"
            exit 1
          fi
